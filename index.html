<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롤 구도 익스포터 | League of Legends Matchup Exporter</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <!-- Summernote CSS -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.css" rel="stylesheet">
    <!-- External Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="css/imageinsert.css">
</head>
<body>

<!-- 상단 헤더 / 네비게이션 바 -->
<nav class="navbar navbar-inverse navbar-fixed-top app-header">
    <div class="container-fluid">
        <!-- 브랜드 로고 및 뷰포트 토글 -->
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar-collapse">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand brand-logo" href="#">
                <span class="brand-highlight">군밤</span>구도 익스포터
            </a>
        </div>

        <div class="collapse navbar-collapse" id="navbar-collapse">
            <!-- 좌측 빠른 드롭다운 선택 -->
            <div class="navbar-form navbar-left header-dropdowns">
                <select id="memo-champion-dropdown" class="form-control nav-select">
                    <option value="">챔피언 메모 선택</option>
                </select>
                <select id="formation-dropdown" class="form-control nav-select">
                    <option value="">구도 메모 선택</option>
                </select>
            </div>

            <!-- 우측 통합 데이터 액션 버튼들 -->
            <div class="navbar-right header-actions">
                <div class="btn-group navbar-btn">
                    <button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown">
                        💾 데이터 관리 <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#" id="load-data-button">문자열 불러오기</a></li>
                        <li><a href="#" id="copy-to-clipboard-button">문자열 내보내기</a></li>
                        <li class="divider"></li>
                        <li><a href="#" id="export-url-button">주소(URL) 복사하기</a></li>
                        <li><a href="#" id="export-data-button">파일로 다운로드</a></li>
                        <li><a href="#" id="import-data-button">파일 불러오기</a></li>
                    </ul>
                </div>

                <div class="btn-group navbar-btn">
                    <button id="set-folder-button" class="btn btn-default" title="폴더 설정">📁 폴더 설정</button>
                    <button id="open-folder-button" class="btn btn-default" title="폴더 열기">📂 폴더 열기</button>
                    <button id="load-default-button" class="btn btn-default">기본값</button>
                </div>

                <a href="https://gunbamguy.github.io/runeexport/" target="_blank" class="btn btn-default navbar-btn external-link">룬 익스포터</a>
                <a href="https://gunbamguy.github.io/itemex" target="_blank" class="btn btn-default navbar-btn external-link">템트리 익스포터</a>

                <button id="delete-memory-button" class="btn btn-danger navbar-btn">전체 데이터 초기화</button>
                <input type="file" id="import-file-input" style="display:none;" accept=".txt">
            </div>
        </div>
    </div>
</nav>

<!-- 메인 스플릿 애플리케이션 영역 -->
<div id="container" class="app-container">
    <!-- 상단 분할 영역 (챔피언 정보 | 밴픽/슬롯 | 챔피언 메모) -->
    <div id="top-container" class="top-container">
        <div id="split-container" class="split-container">
            
            <!-- 1. 왼쪽: 챔피언 정보 창 -->
            <div id="info-container" class="split-section">
                <div class="section-header">
                    <h2><span class="icon">🛡️</span> 챔피언 정보</h2>
                </div>
                <div id="champion-info" class="section-body">
                    <p class="placeholder-text">슬롯이나 드롭다운에서 챔피언을 선택하면 상세 스탯과 스킬 정보가 여기에 표시됩니다.</p>
                </div>
            </div>

            <!-- 좌측 Resizable 수직 구분선 -->
            <div class="divider vertical-divider" id="vertical-divider-left" title="좌우 크기 조절"></div>

            <!-- 2. 가운데: 밴픽/팀 슬롯 메인 창 -->
            <div id="main-container" class="split-section">
                <div class="section-header">
                    <h2><span class="icon">⚔️</span> 밴픽 & 구도 설정</h2>
                    <div class="slot-controls">
                        <button id="add-slot-button" class="btn btn-sm btn-success">+ 슬롯 추가</button>
                        <button id="remove-slot-button" class="btn btn-sm btn-warning">- 슬롯 삭제</button>
                    </div>
                </div>

                <div class="section-body main-body">
                    <!-- 팀 슬롯 1:1 맞대응 대치 목록 -->
                    <div id="team-slots">
                        <div class="matchup-grid">
                            <div id="my-team" class="team-container">
                                <h3 class="team-title my-team-title">아군 (OUR)</h3>
                                <div class="team">
                                    <!-- 슬롯 동적 추가 -->
                                </div>
                            </div>

                            <!-- 라인별 1:1 비교 버튼 -->
                            <div id="comparison-buttons" class="comparison-container"></div>

                            <div id="enemy-team" class="team-container">
                                <h3 class="team-title enemy-team-title">적군 (ENEMY)</h3>
                                <div class="team">
                                    <!-- 슬롯 동적 추가 -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 슬롯 메인 조작 툴바 -->
                    <div class="main-action-toolbar">
                        <button id="select-champion-button" class="btn btn-primary">챔피언 선택 모달</button>
                        <button id="open-popup-button" class="btn btn-info">🔍 밴픽 화면 크게보기</button>
                    </div>
                </div>

                <!-- 챔피언 선택 모달 -->
                <div id="champion-selection" class="modal">
                    <div class="modal-content">
                        <!-- JS에서 동적 생성됨 -->
                    </div>
                </div>
            </div>

            <!-- 우측 Resizable 수직 구분선 -->
            <div class="divider vertical-divider" id="vertical-divider-right" title="좌우 크기 조절"></div>

            <!-- 3. 오른쪽: 챔피언 메모 에디터 창 -->
            <div id="memo-container" class="split-section">
                <div class="section-header">
                    <h2><span class="icon">📝</span> 챔피언 메모</h2>
                    <button id="save-memo-button" class="btn btn-sm btn-primary">메모 저장</button>
                </div>

                <div class="section-body">
                    <div id="editor"></div>
                    <div class="memo-tools">
                        <button id="select-rune-category-button" class="btn btn-sm btn-info">룬 이미지 선택</button>
                        <button id="select-item-category-button" class="btn btn-sm btn-info">아이템 비교 차트</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- 상하 Resizable 수평 구분선 -->
        <div id="horizontal-divider" class="resize-handle-horizontal" title="상하 크기 조절"></div>

        <!-- 4. 하단: 구도페이지 메모 창 -->
        <div id="formation-container" class="formation-container">
            <div class="section-header">
                <h2><span class="icon">🗺️</span> 구도(팀 vs 팀) 총평 메모</h2>
                <button id="save-formation-button" class="btn btn-sm btn-success">구도 메모 저장</button>
            </div>
            <div class="section-body">
                <div id="formation-editor"></div>
            </div>
        </div>
    </div>
</div>

<!-- 외부 라이브러리 (jQuery, Summernote, Chart.js, Bootstrap) -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.18/lang/summernote-ko-KR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<!-- 모듈화 스크립트 연동 -->
<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/folder.js"></script>
<script src="js/imageinsert.js"></script>

</body>
</html>
